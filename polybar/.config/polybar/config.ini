[colors]
base     = #303446
surface0 = #414559
surface1 = #51576d
text     = #c6d0f5
subtext0 = #a5adce
blue     = #8caaee
mauve    = #ca9ee6
green    = #a6d189
red      = #e78284
peach    = #ef9f76
yellow   = #e5c890

[bar/main]
width = 100%
height = 56
dpi = 192
background = ${colors.base}
foreground = ${colors.text}

font-0 = JetBrainsMono Nerd Font:size=10;2

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

modules-left = i3
modules-center = date
modules-right = cpu memory power

line-size = 2
border-size = 0
radius = 0

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-foreground = ${colors.blue}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.blue}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.subtext0}
label-visible-padding = 2

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
label = %date%
label-foreground = ${colors.text}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.mauve}
label = %percentage:2%%
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.green}
label = %percentage_used:2%%
label-foreground = ${colors.text}

[module/power]
type = custom/text
content = 
content-foreground = ${colors.red}
click-left = ~/.config/polybar/power-menu.sh