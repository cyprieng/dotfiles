# General settings
set -s focus-events on
setw -g xterm-keys on
set -g mouse on
set-option -g repeat-time 500
set -g mode-keys vi
set -g history-limit 5000

# Reload configuration keymap
bind r run "sh -c 'tmux source ~/.config/tmux/tmux.conf'" \; display "Config sourced"

# -- Display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 30     # redraw status line every 30 seconds

# Set autoname for windows
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command} - #{b:pane_current_path}'

set -gq allow-passthrough on
set -g visual-activity off

# Subtle bg difference on inactive panes to distinguish active pane
set -g window-style 'bg=#292c3c'
set -g window-active-style 'bg=#303446'

# Bell monitoring
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# -- Navigation ----------------------------------------------------------------

# Create session
bind C-c new-session

# Open new window in pane_current_path
bind c new-window -c "#{pane_current_path}"

# Copy mode
bind 'v' copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# Home/End in copy-mode-vi
bind-key -T copy-mode-vi Home send -X start-of-line
bind-key -T copy-mode-vi End send -X end-of-line

# Word navigation in copy-mode-vi (Alt+Left/Right)
bind-key -T copy-mode-vi M-Left send -X previous-word
bind-key -T copy-mode-vi M-Right send -X next-word-end

# Split current window horizontally
bind - split-window -v -c "#{pane_current_path}"

# Split current window vertically
bind _ split-window -h -c "#{pane_current_path}"

# Swap pane
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# Swap window
bind -r C-p swap-window -d -t -1  # swap current window with the previous one
bind -r C-n swap-window -d -t +1  # swap current window with the next one

# Window navigation (repeatable)
bind -r n next-window
bind -r p previous-window

# Move pane to next position (cycles through)
bind m swap-pane -D       # move current pane to next position

# Window navigation
bind Tab last-window        # move to last active window

# Clear scrollback (Cmd-K via Ghostty custom escape sequence)
bind -n M-K send-keys -R \; clear-history \; send-keys Enter

# Search scrollback (Cmd-F via Ghostty)
bind -n M-F copy-mode \; send-keys ?

# Kill without confirmation
bind-key x kill-pane

# Panic kill: SIGKILL the foreground process running in the pane, WITHOUT killing
# the shell (pane stays open). For when Ctrl+C is fully ignored.
bind-key k run-shell "pkill -9 -P #{pane_pid}"

# Handle home/end keys
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Move status line to top
set -g status-position top

# Fix right-click menu on status bar (powerline) closing instantly on release:
# tmux's default MouseDown3Status/StatusLeft bindings lack the -O flag that
# MouseDown3Pane has, so releasing the click without selecting an item closes the menu.
bind-key -T root MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W -O \
	"#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } \
	"#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
	"#{?pane_marked_set,,-}Swap Marked" s { swap-window } \
	'' \
	Kill X { kill-window } \
	Respawn R { respawn-window -k } \
	"#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
	Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
	'' \
	"New After" w { new-window -a } \
	"New At End" W { new-window }

bind-key -T root MouseDown3StatusLeft display-menu -T "#[align=centre]#{session_name}" -t = -x M -y W -O \
	Next n { switch-client -n } \
	Previous p { switch-client -p } \
	'' \
	Renumber N { move-window -r } \
	Rename r { command-prompt -I "#S" { rename-session "%%" } } \
	Detach d { detach-client } \
	'' \
	"New Session" s { new-session } \
	"New Window" w { new-window }

# Neovim integration
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @smart-splits_resize_left_key  'S-left' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'S-down' #  --"--
set -g @smart-splits_resize_up_key    'S-up' #  --"--
set -g @smart-splits_resize_right_key 'S-right' #  --"--
set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.
set -g @smart-splits_no_wrap 'true' # disable wrapping.
set-hook -g pane-focus-in 'run-shell ~/.config/tmux/smart-splits-fix.sh' # Bugfix for smartsplits sometimes not setting the option

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-logging'

# Theme
set -g @catppuccin_flavor 'frappe'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Initialize TMUX plugin manager
set-environment -g PATH "/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/bin:/usr/bin"
run '~/.config/tmux/plugins/tpm/tpm'

# Disable default bell style to let powerline theme handle it via #{?window_bell_flag,...}
set -g window-status-bell-style none
