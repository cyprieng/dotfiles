backend = "glx"
vsync = true

# Shadows
shadow = true
shadow-radius = 8
shadow-opacity = 0.6
shadow-offset-x = -8
shadow-offset-y = -8
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3bar'"
]

# Transparency
inactive-opacity = 0.92
active-opacity = 1.0
frame-opacity = 1.0
inactive-opacity-override = false

# Fading
fading = true
fade-in-step = 0.04
fade-out-step = 0.04
fade-delta = 5

# Rounded corners
corner-radius = 8
rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3bar'"
]
